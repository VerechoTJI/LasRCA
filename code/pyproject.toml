[project]
name = "code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "drain3>=0.9.11",
    "llama-index>=0.14.22",
    "mkl-service>=2.7.2",
    "numpy<2",
    "openai>=2.41.0",
    "pandas>=2.3.3",
    "pytz>=2026.2",
    "scikit-learn>=1.9.0",
    "torch==2.11.0",
    "torch-geometric>=2.8.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
    "tqdm>=4.68.1",
    "tsaug>=0.2.1",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
